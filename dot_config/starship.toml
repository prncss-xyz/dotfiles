"$schema" = 'https://starship.rs/config-schema.json'

palette = "rose-pine"

[palettes.rose-pine]
overlay = '#26233a'
love = '#eb6f92'
gold = '#f6c177'
rose = '#ebbcba'
pine = '#31748f'
foam = '#9ccfd8'
iris = '#c4a7e7'

[cmd_duration]
min_time = 1000

## keep git_status (files/conflicts) but hide the branch name
[git_branch]
disabled = true
