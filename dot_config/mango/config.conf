# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 0

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.9

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
cursor_hide_timeout=1
cursor_hide_on_keypress=1
drag_tile_to_tile=1

# keyboard (matching river: set-repeat 50 300, layout ca, caps:escape)
repeat_rate=50
repeat_delay=300
numlockon=0
xkb_rules_layout=ca
xkb_rules_options=caps:escape

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
mouse_natural_scrolling=0

# Appearance (solarized dark, matching river)
gappih=4
gappiv=4
gappoh=0
gappov=0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
rootcolor=0x002b36ff
bordercolor=0x586e75ff
focuscolor=0x93a1a1ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# Matching river config: UP=K, DOWN=J, LEFT=semicolon, RIGHT=L

# reload config
bind=SUPER+CTRL,c,reload_config

# launchers
bind=SUPER,d,spawn,fuzzel
bind=SUPER,space,spawn,fuzzel
bind=SUPER,t,spawn,footclient
bind=SUPER+SHIFT,t,spawn,footclient -e bash
bind=SUPER,e,spawn,fish -c neovide
bind=SUPER,y,spawn_shell,.local/bin/browser
bind=SUPER,p,spawn_shell,fish -c STORE_DIR=$HOME/Personal/pass/ tessen
bind=SUPER,s,spawn,grim
bind=SUPER,g,spawn,swaync
bind=SUPER+SHIFT,g,spawn,swaync-client -t
bind=SUPER+SHIFT,d,spawn,darkman toggle
bind=NONE,Print,spawn,grim

# close window / lock
bind=SUPER+CTRL,e,killclient
bind=SUPER+CTRL,q,spawn,waylock

# fullscreen
bind=SUPER,f,togglefullscreen

# focus (hjkl-style: K=up/next, J=down/prev, semicolon=left, L=right)
bind=SUPER,k,focusstack,next
bind=SUPER,j,focusstack,prev
bind=SUPER,semicolon,focusdir,left
bind=SUPER,l,focusdir,right

# swap windows
bind=SUPER+SHIFT,k,exchange_stack_client,next
bind=SUPER+SHIFT,j,exchange_stack_client,prev

# zoom (swap with master)
bind=SUPER,Return,zoom

# monitor focus
bind=SUPER,x,focusmon,left
bind=SUPER,c,focusmon,right
bind=SUPER+SHIFT,x,tagmon,left
bind=SUPER+SHIFT,c,tagmon,right

# adjust mode (Super+R) — resize master area and count
bind=SUPER,r,setkeymode,adjust

keymode=adjust
bind=NONE,Escape,setkeymode,default
bind=NONE,semicolon,setmfact,-0.05
bind=NONE,l,setmfact,+0.05
bind=NONE,k,incnmaster,+1
bind=NONE,j,incnmaster,-1

# float mode (Super+Q) — toggle float, move, resize, snap
keymode=default
bind=SUPER,q,setkeymode,float

keymode=float
bind=NONE,Escape,setkeymode,default
bind=SUPER,space,togglefloating
bind=NONE,semicolon,movewin,-100,0
bind=NONE,j,movewin,0,100
bind=NONE,k,movewin,0,-100
bind=NONE,l,movewin,100,0
bind=SHIFT,semicolon,resizewin,-100,0
bind=SHIFT,j,resizewin,0,100
bind=SHIFT,k,resizewin,0,-100
bind=SHIFT,l,resizewin,100,0
bind=SUPER+ALT+CTRL,p,smartmovewin,left
bind=SUPER+ALT+CTRL,u,smartmovewin,down
bind=SUPER+ALT+CTRL,i,smartmovewin,up
bind=SUPER+ALT+CTRL,o,smartmovewin,right

# audio mode (Super+O)
keymode=default
bind=SUPER,o,setkeymode,audio

keymode=audio
bind=NONE,Escape,setkeymode,default
bind=NONE,k,spawn,pactl set-sink-volume @DEFAULT_SINK@ +4%
bind=NONE,j,spawn,pactl set-sink-volume @DEFAULT_SINK@ -4%
bind=SHIFT,k,spawn,pactl set-sink-volume @DEFAULT_SINK@ +12%
bind=SHIFT,j,spawn,pactl set-sink-volume @DEFAULT_SINK@ -12%
bind=NONE,m,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
bind=NONE,space,spawn,playerctl play-pause
bind=NONE,semicolon,spawn,playerctl previous
bind=NONE,l,spawn,playerctl next
bind=NONE,x,spawn,playerctl stop

# lumino mode (Super+I) — brightness
keymode=default
bind=SUPER,i,setkeymode,lumino

keymode=lumino
bind=NONE,Escape,setkeymode,default
bind=NONE,k,spawn,brightnessctl set 2%+
bind=NONE,j,spawn,brightnessctl set 2%-
bind=SHIFT,k,spawn,brightnessctl set 100%
bind=SHIFT,j,spawn,brightnessctl set 0%

# passthrough mode
keymode=default
bind=SUPER,F10,setkeymode,passthrough

keymode=passthrough
bind=SUPER,F10,setkeymode,default

# media keys (work when locked)
keymode=default
bindl=NONE,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +4%
bindl=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -4%
bindl=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl=NONE,XF86AudioMedia,spawn,playerctl play-pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 2%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 2%-

# power (work when locked)
bindl=SUPER+CTRL,r,spawn,sudo /usr/sbin/reboot
bindl=SUPER+CTRL,p,spawn,sudo /usr/sbin/poweroff

# tags (n=1, m=2, comma=3, period=4, eacute=5)
bind=SUPER,n,view,1,0
bind=SUPER,m,view,2,0
bind=SUPER,comma,view,3,0
bind=SUPER,period,view,4,0
bind=SUPER,eacute,view,5,0
bind=SUPER+SHIFT,n,tag,1,0
bind=SUPER+SHIFT,m,tag,2,0
bind=SUPER+SHIFT,comma,tag,3,0
bind=SUPER+SHIFT,period,tag,4,0
bind=SUPER+SHIFT,eacute,tag,5,0

# previous tagset
bind=SUPER,a,view,-1,0

# all tags
bind=SUPER,0,view,0,0
bind=SUPER+SHIFT,0,toggletag,0

# overview
bind=SUPER,Tab,toggleoverview

# Mouse bindings (matching river)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,togglefloating

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# layer rule
layerrule=animation_type_open:zoom,layer_name:fuzzel
layerrule=animation_type_close:zoom,layer_name:fuzzel

# Window rules (matching river)
windowrule=appid:popup,isfloating:1
windowrule=appid:imv,allow_csd:0
windowrule=appid:firefox,allow_csd:0
windowrule=title:Picture-in-Picture,isfloating:1
windowrule=title:term-prompt,isfloating:1
windowrule=appid:pavucontrol,isfloating:1
windowrule=appid:wlroot,allow_csd:0
windowrule=appid:org.freedesktop.Xwayland,isfloating:1,allow_csd:0

# Autostart (matching river)
exec-once=way-displays
exec=dbus-update-activation-environment XDG_CURRENT_DESKTOP=sway WAYLAND_DISPLAY --systemd --all
exec=turnstile-update-runit-env XDG_CURRENT_DESKTOP=sway WAYLAND_DISPLAY DISPLAY SWAYSOCK PATH
exec-once=foot --server
exec-once=swayidle -w timeout 300 'waylock -fork-on-lock' timeout 600 'mmsg get all-monitors | jq -r ".[].name" | while read -r output; do mmsg dispatch sleep_monitor,"$output"; done' resume 'mmsg get all-monitors | jq -r ".[].name" | while read -r output; do mmsg dispatch wakeup_monitor,"$output"; done' before-sleep 'waylock -fork-on-lock'
exec-once=/usr/libexec/polkit-gnome-authentication-agent-1
exec-once=kdeconnectd
exec-once=swaync
exec-once=wlsunset -S 07:00 -s 16:00
exec-once=udiskie
exec-once=$HOME/.local/bin/random-wallpaper
exec-once=waybar
exec-once=firefox
